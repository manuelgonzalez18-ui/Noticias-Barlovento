#
# Despliega el plugin Noticias Barlovento Core al hosting en cada push a main.
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    -> host FTP que indique cPanel (ftp.noticiasbarlovento.com)
#   FTP_USERNAME  -> usuario FTP restringido a la carpeta del plugin
#   FTP_PASSWORD  -> contrasena de ese usuario
#

name: Desplegar plugin a produccion

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Verificar sintaxis PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Subir por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftps
          port: 21

          local-dir: ./

          # El usuario FTP esta restringido a la carpeta del plugin: al entrar
          # ya aterriza ahi, asi que la ruta es la raiz de su jaula.
          # Si algun dia se usara una cuenta con acceso a todo el hosting,
          # habria que volver a: public_html/wp/wp-content/plugins/noticiasbarlovento-core/
          server-dir: ./

          # Las exclusiones van como bloque de texto, un patron por linea.
          # Si se escriben como lista YAML, Actions rechaza el archivo entero
          # y el workflow ni siquiera arranca.
          # docs/ queda afuera: es documentacion para ejecutar a mano en cPanel
          # y no tiene nada que hacer en la carpeta del plugin.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/docs/**
            **/*.md
            **/.editorconfig
            **/.gitignore

          state-name: .ftp-deploy-sync-state.json
          # Ruta verificada en seco con la cuenta FTP restringida.
          # Desde aca, cada push a main despliega de verdad.
          dry-run: false
          dangerous-clean-slate: false
